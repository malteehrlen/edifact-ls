name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install a C compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Cache Neovim download
        uses: actions/cache@v4
        with:
          path: .tools
          key: nvim-${{ runner.os }}-v0.12.5

      - name: Cache tree-sitter-edifact npm dependencies
        uses: actions/cache@v4
        with:
          path: tree-sitter-edifact/node_modules
          key: ts-node-modules-${{ hashFiles('tree-sitter-edifact/package-lock.json') }}

      - run: make test
      - run: make test-e2e
